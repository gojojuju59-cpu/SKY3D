name: 2D to 3D Automation Converter

on:
  push:
    paths:
      - 'input_2d/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Install Video Frameworks
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Execute Conversion Engine
        run: |
          mkdir -p input_2d/output_3d
          
          # Locates your uploaded movie file
          VIDEO_FILE=$(find input_2d/ -maxdepth 1 -type f \( -name ".mp4" -o -name ".mkv" -o -name ".MP4" -o -name ".MKV" \) | head -n 1)
          
          if [ -z "$VIDEO_FILE" ]; then
            echo "No video file found inside input_2d folder."
            exit 1
          fi
          
          FILENAME=$(basename "$VIDEO_FILE")
          echo "Processing video file: $FILENAME"
          
          # Native Side-by-Side Horizontal Stack Filter (No extra plugins needed)
          ffmpeg -i "$VIDEO_FILE" -filter_complex "[0:v]scale=iw:ih[left]; [0:v]scale=iw:ih[right]; [left][right]hstack[v]" -map "[v]" -map 0:a? -c:v libx264 -crf 23 -c:a copy "input_2d/output_3d/3D_SBS_$FILENAME"

      - name: Commit and Save Finished 3D Movies
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "System Auto-Generated: 3D Render Complete"
          file_pattern: "input_2d/output_3d/*"
